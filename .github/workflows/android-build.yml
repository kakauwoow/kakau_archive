name: Build KAKAU Archive APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Show commit and theme source
        run: |
          git rev-parse HEAD
          sed -n '1,40p' app/src/main/java/com/kakau/archive/ui/theme/KakauTheme.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAKAU-Archive-Native-v4
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
